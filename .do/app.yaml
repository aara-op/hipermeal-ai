name: hipermeal-ai-nutrition-diary
region: nyc
services:
- name: web
  github:
    branch: main
    deploy_on_push: true
  dockerfile_path: Dockerfile
  http_port: 80
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  envs:
  - key: NODE_ENV
    value: production
  - key: VITE_APP_NAME
    value: "HiperMeal AI Nutrition Diary"
